# FitCircle SmartChat MVP - Cloudflare Worker Configuration
# 請將 database_id 替換為您在 Cloudflare Dashboard 建立的 D1 資料庫 ID

name = "fircircle-backend1"
main = "worker.js"
compatibility_date = "2024-01-01"

# D1 Database 設定
# 請在 Cloudflare Dashboard 建立 D1 資料庫後，將 database_id 填入下方
[[d1_databases]]
binding = "DB"
database_name = "fitcircle-db1"
database_id = "10e91431-8ae4-4681-9022-65327096df18"

# 如需設定環境變數，可在下方加入
# [vars]
# ENVIRONMENT = "production"

